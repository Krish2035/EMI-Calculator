<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Central Glowing Brand Plate -->
  <rect x="64" y="64" width="384" height="384" rx="84" fill="url(#badgeGrad)" filter="url(#glow)" />
  
  <!-- Calculator Device Body inside Badge -->
  <rect x="120" y="112" width="272" height="288" rx="36" fill="#0f172a" opacity="0.92" stroke="rgba(255,255,255,0.2)" stroke-width="6" />
  
  <!-- Calculator Screen (Display) -->
  <rect x="152" y="148" width="208" height="68" rx="18" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  <!-- Screen Digits simulation -->
  <circle cx="180" cy="182" r="6" fill="#10b981" />
  <rect x="204" y="174" width="72" height="16" rx="8" fill="#6366f1" opacity="0.8" />
  <rect x="292" y="168" width="48" height="28" rx="8" fill="#10b981" opacity="0.9" />
  
  <!-- Calculator Keypad (4 columns x 3 rows) -->
  <!-- Row 1 -->
  <rect x="152" y="244" width="44" height="36" rx="10" fill="#334155" />
  <rect x="208" y="244" width="44" height="36" rx="10" fill="#334155" />
  <rect x="264" y="244" width="44" height="36" rx="10" fill="#334155" />
  <rect x="320" y="244" width="40" height="36" rx="10" fill="#f43f5e" />
  
  <!-- Row 2 -->
  <rect x="152" y="296" width="44" height="36" rx="10" fill="#334155" />
  <rect x="208" y="296" width="44" height="36" rx="10" fill="#334155" />
  <rect x="264" y="296" width="44" height="36" rx="10" fill="#334155" />
  <rect x="320" y="296" width="40" height="36" rx="10" fill="#6366f1" />
  
  <!-- Row 3 -->
  <rect x="152" y="348" width="44" height="36" rx="10" fill="#334155" />
  <rect x="208" y="348" width="44" height="36" rx="10" fill="#334155" />
  <rect x="264" y="348" width="96" height="36" rx="10" fill="#10b981" />
</svg>
